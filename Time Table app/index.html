<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070B16">
  <meta name="description" content="Time Table is a simple daily task planner for focused, consistent progress.">
  <title>Time Table — Daily task planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-view">Skip to content</a>
  <div id="app-root"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <main class="noscript-card">
      <p class="eyebrow">Time Table</p>
      <h1>JavaScript is required to plan your day.</h1>
      <p>Enable JavaScript to add tasks, track progress, and keep your daily history on this device.</p>
    </main>
  </noscript>
</body>
</html>
